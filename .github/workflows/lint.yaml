name: Lint

on:
    workflow_dispatch: {}
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    format:
        # dotnet format gives the same result on every platform for this netstandard2.0 and
        # net8.0 code, so it runs on Linux, which starts faster than a Windows runner. The
        # working tree is LF on every platform (.gitattributes).
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7.0.1

            - name: Setup .NET
              uses: actions/setup-dotnet@v6.1.0
              with:
                  global-json-file: global.json

            - name: Restore
              run: dotnet restore

            - name: Verify Formatting
              run: dotnet format --verify-no-changes

    prettier:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7.0.1

            - name: Setup Node.js
              uses: actions/setup-node@v7.1.0
              with:
                  node-version: '24'

            - name: Check Non-Code Formatting
              run: npx --yes prettier@3.4.2 --check '**/*.{yml,yaml,json,md}'

    actionlint:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7.0.1

            - name: Install actionlint
              run: |
                  cd /tmp
                  curl -sSfL --retry 5 --retry-delay 3 --retry-all-errors https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz | tar xz actionlint
                  sudo mv actionlint /usr/local/bin/actionlint
                  actionlint -version

            - name: Lint Workflows
              run: actionlint -no-color
